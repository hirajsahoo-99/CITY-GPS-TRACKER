<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Tracker App</title>
<!-- Leaflet CSS/JS (free, no API key needed) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 15px;
  background-color: #f4f7f6;
}
h2 {
  color: #333;
  border-bottom: 2px solid #007bff;
  padding-bottom: 10px;
  font-size: 20px;
  margin-bottom: 15px;
}
.feeds-grid {
  display: flex;
  gap: 15px;
  flex-direction: column;
  margin-top: 10px;
}
.feed-card {
  background: #ffffff;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  border-top: 5px solid #007bff;
  box-sizing: border-box;
  width: 100%;
}
.feed-card.latest {
  border-top-color: #28a745;
  background-color: #f8fff9;
}
.time {
  font-size: 11px;
  color: #777;
  margin-bottom: 10px;
}
.coord {
  font-size: 16px;
  font-weight: bold;
  margin: 8px 0;
  color: #2c3e50;
}
.label {
  color: #007bff;
  font-weight: normal;
}
/* LIVE MAP CONTAINER LAYOUT */
.map-box {
  width: 100%;
  height: 350px;
  margin-top: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  overflow: hidden;
  border: 1px solid #ccc;
  background-color: #e5e3df;
}
#live-map-frame {
  width: 100%;
  height: 100%;
}
.status-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 11px;
  border-radius: 4px;
  background: #e2e8f0;
  font-weight: normal;
  float: right;
  margin-top: 5px;
}
.status-badge.error {
  background: #f8d7da;
  color: #842029;
  font-weight: bold;
}
/* VEHICLE CONNECTION STATUS BADGE */
.vehicle-badge {
  display: inline-block;
  padding: 2px 6px;
  font-size: 11px;
  border-radius: 4px;
  font-weight: bold;
  float: right;
  margin-top: 5px;
  margin-right: 8px;
  color: #fff;
  background: #6c757d;
}
.v-connected { background-color: #28a745; }
.v-disconnected { background-color: #dc3545; }

/* CAR ICON MARKER (top-view car, replaces default Leaflet pin, rotates with heading) */
.car-icon-marker {
  filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
}
.car-icon-marker .car-rotate {
  width: 30px;
  height: 30px;
  transition: transform 0.4s linear; /* smooth turn when heading changes */
}

/* SMALL RE-CENTER BUTTON (positioned over the map, top-right) */
.map-box { position: relative; }
#recenter-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1000;
  width: 30px;
  height: 30px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
#recenter-btn:hover { background: #f0f0f0; }
#recenter-btn svg { width: 18px; height: 18px; }

/* HYBRID / STREET MAP STYLE TOGGLE (sits directly below recenter button) */
#style-toggle-btn {
  position: absolute;
  top: 48px;
  right: 10px;
  z-index: 1000;
  width: 30px;
  height: 30px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #ffffff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
#style-toggle-btn:hover { background: #f0f0f0; }
#style-toggle-btn svg { width: 18px; height: 18px; }
#style-toggle-btn.hybrid-active {
  background: #2c3e50;
  border-color: #2c3e50;
}
#style-toggle-btn.hybrid-active svg polygon,
#style-toggle-btn.hybrid-active svg path {
  stroke: #ffffff;
}

/* TILE LOAD WARNING BANNER (shown over map if MapTiler tiles fail, e.g. domain-restricted key) */
#tile-warning {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  z-index: 1000;
  background: rgba(220, 53, 69, 0.92);
  color: #fff;
  font-size: 11px;
  padding: 6px 8px;
  border-radius: 6px;
  display: none;
}
</style>
</head>
<body>
<h2>
<span id="channel-name">Connecting to GPS...</span>
<span class="status-badge" id="status">Live Tracking</span>
<span class="vehicle-badge" id="vehicle-status">Checking...</span>
</h2>
<!-- 1. Latitude/Longitude Display Area -->
<div id="feeds-container" class="feeds-grid">Loading coordinates...</div>
<!-- 2. Leaflet Map (shows trajectory path) -->
<div class="map-box">
<div id="live-map-frame"></div>
<button id="recenter-btn" title="Re-center map">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="12" cy="12" r="5.5" stroke="#333" stroke-width="1.6"/>
    <circle cx="12" cy="12" r="1.4" fill="#333"/>
    <path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2" stroke="#333" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M3 3v4.5M3 3h4.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 3v4.5M21 3h-4.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 21v-4.5M3 21h4.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 21v-4.5M21 21h-4.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
<button id="style-toggle-btn" title="Toggle Hybrid / Street view">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="12,3 21,8 12,13 3,8" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M3 12 L12 17 L21 12" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M3 16 L12 21 L21 16" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</button>
<div id="tile-warning">Map tiles blocked — check your MapTiler API key's allowed domains.</div>
</div>
<script>
// ---------------------------------------------------------------------------
// DATA SOURCE: Firebase Realtime Database (was ThingSpeak before -- swapped
// out here, nothing else in this file touched). orderBy="$key" + limitToLast
// works because Firebase push keys are chronologically sortable, so this
// gives us the most recent N fixes just like the old ThingSpeak "results=50"
// param did.
const FIREBASE_HOST = "city-gps-tracker-default-rtdb.asia-southeast1.firebasedatabase.app";
const FIREBASE_PATH = "/gps_history.json";
const url = `https://${FIREBASE_HOST}${FIREBASE_PATH}?orderBy=%22$key%22&limitToLast=200`;
// ---------------------------------------------------------------------------

// Leaflet map init (ek hi baar)
const MAPTILER_KEY = "uqDjOTcIKm28iF924vhH"; // same key used for every style below

// The two MapTiler raster styles in use, same key for both. "hybrid" = satellite
// imagery WITH roads/labels drawn on top (plain "satellite" would have no roads).
const MAP_STYLES = [
  { id: 'openstreetmap', label: 'Streets (OSM)', ext: 'png' },
  { id: 'hybrid',        label: 'Hybrid (Satellite+Roads)', ext: 'jpg' }
];
const tileLayerCache = {}; // styleId -> L.tileLayer instance, built lazily on first use
let currentStyleId = 'openstreetmap';
let map = null;
let pathLine = null;
let startMarker = null;
let liveMarker = null;
let hasAutoFitted = false; // ensures we only auto zoom/pan on the very first load
let lastPathBounds = null; // remembers latest trajectory bounds for the recenter button
let tileErrorShown = false; // avoid spamming the warning banner on every failed tile
let followMode = true; // true = map keeps auto-panning to follow the car every update
let lastKnownPoint = null; // most recent car position, used when recenter button re-enables follow

// Re-center button: jab click ho, follow mode wapas ON kar do aur turant latest point par snap karo
document.getElementById('recenter-btn').addEventListener('click', function() {
  followMode = true;
  if (map && lastKnownPoint) {
    map.panTo(lastKnownPoint, { animate: true });
  } else if (map && lastPathBounds) {
    map.fitBounds(lastPathBounds, { padding: [30, 30] });
  }
});

// Style toggle button: single click flips between Street (OSM) and Hybrid.
document.getElementById('style-toggle-btn').addEventListener('click', function() {
  const nextStyleId = currentStyleId === 'openstreetmap' ? 'hybrid' : 'openstreetmap';
  switchMapStyle(nextStyleId);
  this.classList.toggle('hybrid-active', nextStyleId === 'hybrid');
});

// Top-view car SVG. Default artwork points "up" (north = 0deg heading).
const CAR_SVG = `
<svg class="car-rotate" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- car body (top-down view) -->
    <rect x="12" y="4" width="16" height="30" rx="6" fill="#e63946" stroke="#7a1620" stroke-width="1"/>
    <!-- windshield -->
    <rect x="15" y="8" width="10" height="6" rx="2" fill="#a8dadc"/>
    <!-- rear window -->
    <rect x="15" y="25" width="10" height="6" rx="2" fill="#a8dadc"/>
    <!-- wheels -->
    <rect x="8" y="9" width="4" height="7" rx="1.5" fill="#222"/>
    <rect x="28" y="9" width="4" height="7" rx="1.5" fill="#222"/>
    <rect x="8" y="22" width="4" height="7" rx="1.5" fill="#222"/>
    <rect x="28" y="22" width="4" height="7" rx="1.5" fill="#222"/>
  </g>
</svg>`;

// Builds a car marker icon rotated to face the given heading (degrees, 0 = north/up)
function getCarIcon(headingDeg) {
  return L.divIcon({
    className: 'car-icon-marker',
    html: `<div class="car-rotate" style="transform: rotate(${headingDeg}deg);">${CAR_SVG}</div>`,
    iconSize: [30, 30],
    iconAnchor: [15, 15],
    popupAnchor: [0, -15]
  });
}

// Compass bearing (0-360, 0=north) from point A to point B
function computeBearing(latA, lonA, latB, lonB) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;
  const dLon = toRad(lonB - lonA);
  const y = Math.sin(dLon) * Math.cos(toRad(latB));
  const x = Math.cos(toRad(latA)) * Math.sin(toRad(latB)) -
            Math.sin(toRad(latA)) * Math.cos(toRad(latB)) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

let lastHeading = 0; // keeps the car facing its last known direction if no new movement

// Builds (or reuses from cache) the L.tileLayer for a given MapTiler style id,
// wiring up the shared tile-error/tile-load warning banner the first time.
function getOrCreateTileLayer(styleId) {
  if (tileLayerCache[styleId]) return tileLayerCache[styleId];
  const style = MAP_STYLES.find(s => s.id === styleId);
  const layer = L.tileLayer(
    `https://api.maptiler.com/maps/${style.id}/{z}/{x}/{y}.${style.ext}?key=${MAPTILER_KEY}`,
    { maxZoom: 20, attribution: '&copy; MapTiler &copy; OpenStreetMap contributors' }
  );
  layer.on('tileerror', function() {
    if (!tileErrorShown) {
      tileErrorShown = true;
      document.getElementById('tile-warning').style.display = 'block';
      document.getElementById('status').textContent = "Map Error";
      document.getElementById('status').className = "status-badge error";
    }
  });
  layer.on('tileload', function() {
    if (tileErrorShown) {
      tileErrorShown = false;
      document.getElementById('tile-warning').style.display = 'none';
    }
  });
  tileLayerCache[styleId] = layer;
  return layer;
}

// Swaps the active base layer. Only touches the tile layer -- path/markers/zoom/
// pan are never affected, so switching styles never disturbs follow mode etc.
function switchMapStyle(styleId) {
  if (!map || styleId === currentStyleId) return;
  const oldLayer = tileLayerCache[currentStyleId];
  if (oldLayer && map.hasLayer(oldLayer)) map.removeLayer(oldLayer);
  const newLayer = getOrCreateTileLayer(styleId);
  newLayer.addTo(map);
  currentStyleId = styleId;
}

function initMapIfNeeded() {
 if (map) return;
 map = L.map('live-map-frame').setView([20.95575, 84.47108], 15);
 getOrCreateTileLayer(currentStyleId).addTo(map); // default style on first load

 // Leaflet sometimes computes the container size before layout/CSS fully settles;
 // force a resize check shortly after init so tiles/markers align correctly.
 setTimeout(() => map.invalidateSize(), 200);
 window.addEventListener('resize', () => map.invalidateSize());

 // FIX: auto-follow the car every update UNTIL the user manually drags/zooms/scrolls.
 // We listen on the raw DOM container (mousedown/touchstart/wheel/dblclick) instead of
 // Leaflet's semantic 'dragstart'/'zoomstart' events, because those also fire for our
 // own programmatic panTo()/fitBounds() calls -- raw input events only fire for a real
 // user gesture, so they don't get confused with the follow-logic's own map movements.
 const mapContainer = map.getContainer();
 const disableFollow = () => { followMode = false; };
 mapContainer.addEventListener('mousedown', disableFollow);
 mapContainer.addEventListener('touchstart', disableFollow, { passive: true });
 mapContainer.addEventListener('wheel', disableFollow, { passive: true });
 mapContainer.addEventListener('dblclick', disableFollow);
}

// Converts the raw Firebase gps_history object ({pushKey: {lat,lng,speed,ts}, ...})
// into the same {channel, feeds:[{field1,field2,field3,created_at}, ...]} shape the
// rest of this file was already written to expect (field1=lat, field2=lng,
// field3=speed, created_at=timestamp) -- so nothing below this needs to change.
function firebaseToFeedsFormat(fbData) {
  if (!fbData) return { channel: { name: "City GPS Tracker" }, feeds: [] };
  const keys = Object.keys(fbData).sort(); // push keys sort chronologically
  const feeds = keys.map(k => {
    const entry = fbData[k];
    return {
      field1: String(entry.lat),
      field2: String(entry.lng),
      field3: String(entry.speed),
      created_at: new Date(entry.ts).toISOString()
    };
  });
  return { channel: { name: "City GPS Tracker" }, feeds };
}

function fetchAndRenderData() {
document.getElementById('status').textContent = "Updating...";
document.getElementById('status').className = "status-badge";
fetch(url)
.then(response => response.json())
.then(fbData => {
const data = firebaseToFeedsFormat(fbData);
document.getElementById('channel-name').textContent = data.channel.name;
const container = document.getElementById('feeds-container');
container.innerHTML = '';
if (!data.feeds || data.feeds.length === 0) {
container.innerHTML = "No GPS feeds available.";
document.getElementById('vehicle-status').textContent = "Disconnected";
document.getElementById('vehicle-status').className = "vehicle-badge v-disconnected";
return;
}
// ---- Build the trajectory point list (valid lat/lng only) ----
const trackPoints = [];
data.feeds.forEach(f => {
 const la = parseFloat(f.field1);
 const lo = parseFloat(f.field2);
 if (!isNaN(la) && !isNaN(lo) && !(la === 0 && lo === 0)) {
 trackPoints.push([la, lo]);
 }
});
// Cards: sirf latest 2 feeds dikhate hain (jaisa pehle tha)
const cardsToShow = data.feeds.slice(-2);
for (let i = cardsToShow.length - 1; i >= 0; i--) {
const feed = cardsToShow[i];
// Custom Date & HH.MM AM/PM Format Converter
const dateObj = new Date(feed.created_at);
const dateString = dateObj.toLocaleDateString();
let hours = dateObj.getHours();
const minutes = dateObj.getMinutes().toString().padStart(2, '0');
const ampm = hours >= 12 ? 'PM' : 'AM';
hours = hours % 12;
hours = hours ? hours : 12;
const hoursString = hours.toString().padStart(2, '0');
const formattedTime = `${dateString}, ${hoursString}.${minutes} ${ampm}`;
const pingTime = dateObj.getTime();
const nowTime = new Date().getTime();
const diffTotalMins = Math.floor((nowTime - pingTime) / (1000 * 60));
// --- DYNAMIC TIME AGO LOGIC ---
let agoText = "";
if (diffTotalMins < 1) {
agoText = "<b>(Just Now)</b>";
} else if (diffTotalMins < 60) {
agoText = `<b>(${diffTotalMins} mint ago)</b>`;
} else if (diffTotalMins < 1440) {
const displayHours = Math.floor(diffTotalMins / 60);
const displayMins = diffTotalMins % 60;
agoText = `<b>(${displayHours} hour ${displayMins} mint ago)</b>`;
} else {
const displayDays = Math.floor(diffTotalMins / 1440);
agoText = `<b>(${displayDays} day ago)</b>`;
}
const isLatest = (i === cardsToShow.length - 1);
const rawSpeed = parseFloat(feed.field3);
const speed = (!isNaN(rawSpeed)) ? Math.round(rawSpeed) + " km/h" : "0 km/h";
const card = `
<div class="feed-card ${isLatest ? 'latest' : ''}">
<div class="time">🕒 ${formattedTime} ${isLatest ? agoText : ''}</div>
<div class="coord"><span class="label">Latitude:</span> ${feed.field1 || 'N/A'}</div>
<div class="coord"><span class="label">Longitude:</span> ${feed.field2 || 'N/A'}</div>
<div class="coord"><span class="label">Speed:</span> ${speed}</div>
</div>`;
container.innerHTML += card;
}
// ---- Draw trajectory on Leaflet map ----
initMapIfNeeded();
if (trackPoints.length > 0) {
 // Path line
 if (pathLine) { map.removeLayer(pathLine); }
 pathLine = L.polyline(trackPoints, { color: '#007bff', weight: 4, opacity: 0.8 }).addTo(map);
 // Start marker
 if (startMarker) { map.removeLayer(startMarker); }
 startMarker = L.circleMarker(trackPoints[0], { radius: 6, color: '#28a745', fillColor: '#28a745', fillOpacity: 1 })
 .addTo(map).bindPopup("Start");
 // Latest/live marker (top-view car icon, rotated to face direction of travel)
 const lastPoint = trackPoints[trackPoints.length - 1];
 if (trackPoints.length >= 2) {
   const prevPoint = trackPoints[trackPoints.length - 2];
   // only update heading if the car actually moved (avoids jitter when stationary)
   if (prevPoint[0] !== lastPoint[0] || prevPoint[1] !== lastPoint[1]) {
     lastHeading = computeBearing(prevPoint[0], prevPoint[1], lastPoint[0], lastPoint[1]);
   }
 }
 if (liveMarker) { map.removeLayer(liveMarker); }
 liveMarker = L.marker(lastPoint, { icon: getCarIcon(lastHeading) }).addTo(map).bindPopup("Latest position");
 // Remember bounds/point for the manual re-center button
 lastPathBounds = pathLine.getBounds();
 lastKnownPoint = lastPoint;
 // Fit map to show the whole path on the very first load only.
 if (!hasAutoFitted) {
   map.fitBounds(lastPathBounds, { padding: [30, 30] });
   hasAutoFitted = true;
 } else if (followMode) {
   // FIX: keep following the car on every update (pan only, never re-zoom) so it
   // never drifts outside the visible area. Stops automatically the moment the
   // user drags/zooms/scrolls the map themselves; resumes on Recenter tap.
   map.panTo(lastPoint, { animate: true });
 }
}
// Vehicle Connection Status Logic (Checking if latest ping is within 3 minutes)
const latestFeed = data.feeds[data.feeds.length - 1];
const lastPingTime = new Date(latestFeed.created_at).getTime();
const currentTime = new Date().getTime();
const diffMinutes = (currentTime - lastPingTime) / (1000 * 60);
const vehicleStatusEl = document.getElementById('vehicle-status');
if (diffMinutes <= 3) {
vehicleStatusEl.textContent = "Vehicle Connected";
vehicleStatusEl.className = "vehicle-badge v-connected";
} else {
vehicleStatusEl.textContent = "Vehicle Disconnected";
vehicleStatusEl.className = "vehicle-badge v-disconnected";
}
if (!tileErrorShown) {
  document.getElementById('status').textContent = "Live";
  document.getElementById('status').className = "status-badge";
}
})
.catch(error => {
console.error("App layer execution exception:", error);
document.getElementById('status').textContent = "Offline / Error";
document.getElementById('status').className = "status-badge error";
document.getElementById('vehicle-status').textContent = "Disconnected";
document.getElementById('vehicle-status').className = "vehicle-badge v-disconnected";
});
}
// Startup render call
fetchAndRenderData();
// 15 seconds real-time auto-refresh loop
setInterval(fetchAndRenderData, 2000);
</script>
</body>
</html>
